<!DOCTYPE html>
<html lang="zh_CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>免费版BookmarkHub</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #212529;
      --muted: #6c757d;
      --border: #dee2e6;
      --primary: #0d6efd;
      --primary-hover: #0a58ca;
      --danger: #dc3545;
      --success: #198754;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #f8f9fa;
        --muted: #adb5bd;
        --border: #495057;
        --primary: #0d6efd;
        --primary-hover: #3d8bfd;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 15px; margin: 0; flex: 1; }
    .header .free-tag {
      font-size: 10px;
      background: var(--success);
      color: #fff;
      border-radius: 4px;
      padding: 2px 5px;
    }
    .header .icon-btn {
      flex: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header .icon-btn:hover { background: rgba(128,128,128,.15); color: var(--fg); }
    .header .icon-btn:disabled { opacity: .5; }
    .header .icon-btn.spinning { animation: spin .8s linear infinite; }
    .stats {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat .num { font-size: 18px; font-weight: 600; }
    .stat .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
    button {
      flex: 1;
      padding: 8px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: rgba(128,128,128,.12); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { color: var(--danger); border-color: var(--danger); }
    button.danger:hover { background: rgba(220,53,69,.12); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 16px;
      margin: 4px 0;
    }
    .status.ok { color: var(--success); }
    .status.err { color: var(--danger); }
    .footer {
      margin-top: 10px;
      text-align: center;
    }
    .footer a { color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; }
    .spin {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--muted);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: -2px;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/48.png" alt="">
    <h1>免费版BookmarkHub</h1>
    <span class="free-tag">免费</span>
    <button class="icon-btn" id="btnRefresh" title="刷新：重算本地数，拉云端实际条数">⟳</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="localCount">-</div>
      <div class="label">本地书签</div>
    </div>
    <div class="stat">
      <div class="num" id="remoteCount">-</div>
      <div class="label">云端书签</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="primary" id="btnUpload">↑ 上传</button>
    <button class="primary" id="btnDownload">↓ 下载</button>
  </div>
  <div class="status" id="status"></div>
  <div class="btn-row">
    <button id="btnOptions">⚙ 设置</button>
    <button class="danger" id="btnRemoveAll">清空本地</button>
  </div>

  <div class="footer"><a id="linkOptions">首次使用请先配置 Token 和 Gist</a></div>

  <script src="popup.js"></script>
</body>
</html>
